[workspace]
members = [
    "node/linux",
    "clients/linux",
    "registry/aggregator",
    "registry/coordinator-client",
    "registry/coordinator",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
alloy = { version = "2.3.0", features = ["full"] }
async-stream = "0.3.6"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum-server-mtls = "0.1.2"
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
futures = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "socks", "stream"] }
ring = "0.17.14"
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempo-alloy = "1.8.1"
tempo-contracts = { version = "1.8.1", features = ["rpc"] }
tempo-primitives = { version = "1.8.1", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.55"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower = "0.5.3"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
x509-parser = "0.18.0"
mpp = { version = "=0.11.0", features = ["tempo", "server", "axum"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
