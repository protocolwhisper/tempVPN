[workspace]
members = [
    "node/linux",
    "clients/linux",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
alloy = { version = "2.3.0", features = ["full"] }
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "socks"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempo-alloy = "1.8.1"
tempo-contracts = { version = "1.8.1", features = ["rpc"] }
tempo-primitives = { version = "1.8.1", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
uuid = { version = "1.23.3", features = ["v4"] }
mpp = { version = "=0.11.0", features = ["tempo", "server", "axum"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
